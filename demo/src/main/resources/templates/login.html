<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{menu :: menu}"></div>
<hr>
<h1>Login</h1>
// Controller2-ben ez van: return "redirect:/login?registered";
<div th:if="${param.registered}" style="color: green;">Successful registration! You can log in.</div>
// hibás login esetén ez az URL: http://localhost:8080/login?error
<div th:if="${param.error}" style="color: red;">Incorrect username or password!</div>
<form th:action="@{/login}" method="post">
    <label>Username:</label><input type="text" name="username"><br>
    <label>Password:</label><input type="password" name="password"><br>
    <button type="submit">Login</button>
</form>
</body>
</html>
