
<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kapcsolat - Édes Álmok Cukrászda</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="is-preload">
    <div id="wrapper">
        <div id="main">
            <div class="inner">
                <header id="header">
                    <a th:href="@{/}" class="logo">
                        <strong>Édes Álmok</strong> Cukrászda
                    </a>
                </header>
                <section>
                    <header class="major">
                        <h2>Kapcsolatfelvétel</h2>
                    </header>
                    <p>
                        Kérdésed vagy észrevételed van? Küldj nekünk üzenetet!
                    </p>

                    <div th:if="${param.siker != null}"
                         style="padding: 15px;
                        margin-bottom: 20px;
                        border-left: 4px solid #4CAF50;
                        background-color: #f1f8f1;
                        color: #256029;
                        border-radius: 4px;">
                        <strong>✓ Az üzenetedet sikeresen elküldtük!</strong>
                    </div>

                    <form th:action="@{/kapcsolat}"
                          th:object="${uzenet}"
                          method="post">
                        <div class="row gtr-uniform">
                            <div class="col-6 col-12-xsmall">
                                <label for="nev">Név</label>
                                <input type="text"
                                       id="nev"
                                       th:field="*{nev}"
                                       maxlength="100"
                                       placeholder="Teljes név">
                                <p th:if="${#fields.hasErrors('nev')}"
                                   th:errors="*{nev}"
                                   style="color: red;"></p>
                            </div>
                            <div class="col-6 col-12-xsmall">
                                <label for="email">E-mail-cím</label>
                                <input type="email"
                                       id="email"
                                       th:field="*{email}"
                                       maxlength="150"
                                       placeholder="pelda@email.hu">
                                <p th:if="${#fields.hasErrors('email')}"
                                   th:errors="*{email}"
                                   style="color: red;"></p>
                            </div>
                            <div class="col-12">
                                <label for="szoveg">Üzenet</label>
                                <textarea id="szoveg"
                                          th:field="*{szoveg}"
                                          rows="6"
                                          maxlength="2000"
                                          placeholder="Írd ide az üzenetedet..."></textarea>
                                <p th:if="${#fields.hasErrors('szoveg')}"
                                   th:errors="*{szoveg}"
                                   style="color: red;"></p>
                            </div>
                            <div class="col-12">
                                <ul class="actions">
                                    <li>
                                        <button type="submit"
                                                class="primary">
                                            Üzenet küldése
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </div>
        <div id="sidebar">
            <div class="inner">
                <div th:replace="~{menu :: menu}"></div>
            </div>
        </div>
    </div>
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
