<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Sütemény szerkesztése - Édes Álmok Cukrászda</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="is-preload">
    <div id="wrapper">

        <!-- Fő tartalom -->
        <div id="main">
            <div class="inner">
                <header id="header">
                    <a th:href="@{/}" class="logo">
                        <strong>Édes Álmok</strong> Cukrászda
                    </a>
                </header>
                <section>
                    <header class="major">
                        <h2>Sütemény szerkesztése</h2>
                    </header>
                    <p>
                        Itt módosíthatod a kiválasztott
                        sütemény adatait.
                    </p>
                    <p th:if="${hiba}"
                       th:text="${hiba}"
                       style="color: #f56a6a;">
                    </p>
                    <form th:action="@{/edit}"
                          th:object="${suti}"
                          method="post">
                        <div class="row gtr-uniform">

                            <!-- Azonosító -->
                            <div class="col-12">
                                <label for="id">
                                    Sütemény azonosítója
                                </label>
                                <input type="number"
                                       id="id"
                                       th:value="*{id}"
                                       readonly>
                                <input type="hidden"
                                       th:field="*{id}">
                            </div>

                            <!-- Név -->
                            <div class="col-12">
                                <label for="nev">
                                    Sütemény neve
                                </label>
                                <input type="text"
                                       id="nev"
                                       th:field="*{név}"
                                       maxlength="255"
                                       required>
                            </div>

                            <!-- Típus -->
                            <div class="col-12">
                                <label for="tipus">
                                    Sütemény típusa
                                </label>
                                <input type="text"
                                       id="tipus"
                                       th:field="*{tipus}"
                                       maxlength="255"
                                       required>
                            </div>

                            <!-- Díjazott -->
                            <div class="col-12">
                                <input type="checkbox"
                                       id="dijazott"
                                       th:field="*{dijazott}">
                                <label for="dijazott">
                                    Díjazott sütemény
                                </label>
                            </div>

                            <!-- Gombok -->
                            <div class="col-12">
                                <ul class="actions">
                                    <li>
                                        <button type="submit"
                                                class="primary">
                                            Módosítás mentése
                                        </button>
                                    </li>
                                    <li>
                                        <a th:href="@{/crud}"
                                           class="button">
                                            Mégse
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </div>

        <!-- Oldalsó menü -->
        <div id="sidebar">
            <div class="inner">
                <div th:replace="~{menu :: menu}"></div>
            </div>
        </div>
    </div>
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
