<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Sütemény szerkesztése - Édes Álmok Cukrászda</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="is-preload">
    <div id="wrapper">

        <!-- Fő tartalom -->
        <div id="main">
            <div class="inner">
                <header id="header">
                    <a th:href="@{/}" class="logo">
                        <strong>Édes Álmok</strong> Cukrászda
                    </a>
                </header>
                <section>
                    <header class="major">
                        <h2>Sütemény szerkesztése</h2>
                    </header>
                    <p>
                        Módosítsd a kiválasztott sütemény adatait,
                        majd kattints a mentés gombra.
                    </p>

                    <!-- Hibaüzenet -->
                    <div th:if="${hiba}"
                         th:text="${hiba}"
                         style="
                            background-color: #ffebee;
                            color: #c62828;
                            border: 1px solid #ef9a9a;
                            border-radius: 6px;
                            padding: 15px;
                            margin-bottom: 20px;
                         ">
                    </div>
                    <form th:action="@{/edit}"
                          th:object="${suti}"
                          method="post">

                        <!-- Az ID rejtve marad -->
                        <input type="hidden" th:field="*{id}">
                        <div class="row gtr-uniform">

                            <!-- Sütemény neve -->
                            <div class="col-12">
                                <label for="nev">
                                    Sütemény neve
                                </label>
                                <input type="text"
                                       id="nev"
                                       th:field="*{név}"
                                       maxlength="150"
                                       required>
                            </div>

                            <!-- Sütemény típusa -->
                            <div class="col-12">
                                <label for="tipus">
                                    Sütemény típusa
                                </label>
                                <select id="tipus"
                                        th:field="*{tipus}"
                                        required>
                                    <option value="">
                                        Válassz típust!
                                    </option>
                                    <option th:each="tipus : ${tipusok}"
                                            th:value="${tipus}"
                                            th:text="${tipus}">
                                    </option>
                                </select>
                            </div>

                            <!-- Díjazott -->
                            <div class="col-12">
                                <label for="dijazott">
                                    Díjazott sütemény?
                                </label>
                                <select id="dijazott"
                                        th:field="*{dijazott}"
                                        required>
                                    <option value="false">Nem</option>
                                    <option value="true">Igen</option>
                                </select>
                            </div>

                            <!-- Gombok -->
                            <div class="col-12">
                                <ul class="actions">
                                    <li>
                                        <button type="submit"
                                                class="primary">
                                            Módosítás mentése
                                        </button>
                                    </li>
                                    <li>
                                        <a th:href="@{/crud}"
                                           class="button">
                                            Mégse
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </div>

        <!-- Oldalsó menü -->
        <div id="sidebar">
            <div class="inner">
                <div th:replace="~{menu :: menu}"></div>
            </div>
        </div>
    </div>
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
